<!doctype html>
<html lang="en">

<title>Page not found | Maison Alpin</title>
<!-- Shown by the host for any address that does not exist (GitHub Pages, Cloudflare Pages and Netlify use 404.html automatically;
     on Apache/Infomaniak add "ErrorDocument 404 /404.html" to .htaccess).
     It can appear at any path, so every link uses the full site address. Change it together with contact.website. -->
<link rel="icon" href="https://bondanil.github.io/massage-salon-prototype/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://bondanil.github.io/massage-salon-prototype/assets/styles.css">
<style>
  .notfound{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:48px 16px;color:#fff;
    background:radial-gradient(ellipse at 75% 30%,rgba(176,138,78,.45),transparent 55%),linear-gradient(135deg,#2b2520 0%,#463a2e 45%,#6d5a45 100%)}
  .notfound .logo{align-items:center;margin-bottom:36px;color:#fff}
  .notfound .logo i{color:#e9d3ad}
  .notfound .code{font-family:var(--serif);font-size:clamp(4rem,14vw,7rem);line-height:1;color:#e9d3ad;margin:0}
  .notfound h1{font-size:clamp(1.8rem,5vw,2.6rem);margin:8px 0 12px}
  .notfound p{max-width:460px;margin:0 auto 32px;color:#efe6d8}
  .notfound .ctas{justify-content:center}
</style>
</head>
<body>
<main class="notfound">
  <div>
    <a class="logo" href="https://bondanil.github.io/massage-salon-prototype/"><b>MAISON ALPIN</b><i>beauty &amp; massage · Saanen</i></a>

    <h1>Page not found</h1>

    <div class="ctas">
      <a class="btn btn-gold" href="https://bondanil.github.io/massage-salon-prototype/">Go to the home page</a>
      <a class="btn btn-ghost" href="https://bondanil.github.io/massage-salon-prototype/#contact">Contact</a>
    </div>
  </div>
</main>
</body>
</html>
